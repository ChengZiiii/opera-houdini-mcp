<?xml version="1.0" encoding="UTF-8"?>
<!-- Soren Houdini MCP 图标：深色圆角底 + 橙色 H（Houdini）+ 蓝色插头（MCP 连接） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272c34"/>
      <stop offset="1" stop-color="#101317"/>
    </linearGradient>
    <linearGradient id="hGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.55" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#f26a1b"/>
    </linearGradient>
    <linearGradient id="plugGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="1" stop-color="#2fa8e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)"/>
  <circle cx="64" cy="64" r="56" fill="url(#glow)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="23.25" fill="none" stroke="#3a424d" stroke-width="1.5"/>

  <!-- H 左腿 -->
  <rect x="30" y="30" width="17" height="68" rx="6" fill="url(#hGrad)"/>
  <!-- H 右腿 -->
  <rect x="81" y="30" width="17" height="68" rx="6" fill="url(#hGrad)"/>
  <!-- 横梁（左段，与插头相连） -->
  <rect x="30" y="54" width="28" height="20" rx="6" fill="url(#hGrad)"/>

  <!-- MCP 插头：插头体 + 双插脚（即将插入右腿） -->
  <rect x="58" y="52" width="15" height="24" rx="4" fill="url(#plugGrad)"/>
  <rect x="74" y="58" width="4" height="6" rx="1.5" fill="#aee6ff"/>
  <rect x="74" y="66" width="4" height="6" rx="1.5" fill="#aee6ff"/>

  <!-- 顶部高光 -->
  <rect x="8" y="8" width="112" height="3" rx="1.5" fill="#ffffff" opacity="0.06"/>
</svg>
